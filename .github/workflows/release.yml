name: Release

# Push a tag that matches manifest.json's version (e.g. `git tag 1.0.1 && git push origin 1.0.1`).
# Obsidian's official workflow validates, builds, attests the artifacts and creates a
# draft release; review and publish it on the Releases page.
on:
  push:
    tags: ['*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - uses: obsidianmd/obsidian-workflows@v1
        with:
          mode: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
